[workspace]
resolver = "2"

members = [
    "binex", 
    "bin2rnx",
    "crx2rnx", 
    "qc-traits", 
    "rinex", 
    "rinex-qc", 
    "rnx2bin", 
    "rnx2crx", 
    "sp3",
    "sinex",
    "ublox-rnx", 
]

# rinex-cli declares positioning modules that are not part of this tree
# and cannot build here: the CLI lives in nav-solutions/rinex-cli.
exclude = [
    "./test_resources",
    "./rinex-cli",
]

[profile.release]
strip = true
opt-level = 3
lto = "thin"
codegen-units = 1
